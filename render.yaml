services:
  - type: web
    name: covenant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && bash fetch_data.sh
    startCommand: gunicorn --workers 1 --timeout 60 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: CH_API_KEY
        sync: false          # set in the Render dashboard, never committed
      - key: PYTHON_VERSION
        value: 3.12.7
