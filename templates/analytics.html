{% if cf_token %}
{#
  Cloudflare Web Analytics. Cookieless, stores nothing on the device, and
  collects no personal data or fingerprint, so no consent banner is required
  and visitors get a page with no interstitial. It counts page views, referrers
  and Core Web Vitals, and nothing else.
#}
<script defer src="https://static.cloudflareinsights.com/beacon.min.js"
        data-cf-beacon='{"token": "{{ cf_token }}"}'></script>
{% endif %}
