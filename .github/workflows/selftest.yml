name: selftest
on: [push, pull_request]

jobs:
  scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      # No API key, no network, no snapshot: the scoring proves itself against
      # captured real payloads, including that the Pret trading entity must
      # outrank the holding vehicle.
      - run: python covenant.py --selftest
